name: Market dashboard

on:
  # Schedule disabled: the hourly snapshot now runs locally on the Raspberry Pi
  # (Hermes cron -> market_screener_hourly.py -> collect/build/git push + Telegram).
  # This workflow remains for manual workflow_dispatch runs only.
  workflow_dispatch:
    inputs:
      tier:
        description: "hourly (TradingView only) or daily (adds Yahoo backtests)"
        type: choice
        options: [hourly, daily]
        default: hourly

# One run at a time: two collectors would race on docs/data.json and the loser's
# commit would be rejected anyway.
concurrency:
  group: dashboard
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
      APCA_API_KEY_ID: ${{ secrets.APCA_API_KEY_ID }}
      APCA_API_SECRET_KEY: ${{ secrets.APCA_API_SECRET_KEY }}
      FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
      BLS_API_KEY: ${{ secrets.BLS_API_KEY }}
      EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
      COINGECKO_DEMO_API_KEY: ${{ secrets.COINGECKO_DEMO_API_KEY }}
      MARKETAUX_API_TOKEN: ${{ secrets.MARKETAUX_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - run: uv sync --frozen

      - uses: actions/cache/restore@v4
        with:
          path: .screener
          key: private-screener-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: private-screener-${{ github.ref_name }}-

      - name: Collect snapshot
        id: snapshot
        continue-on-error: true
        timeout-minutes: 20
        env:
          MARKETAUX_DAILY_BUDGET: "90"
        run: uv run python dashboard/collect.py ${{ inputs.tier && format('--tier {0}', inputs.tier) || '' }}

      - name: Collect breakout evidence
        id: breakout
        if: always()
        continue-on-error: true
        timeout-minutes: 8
        # Restart only inactive revised histories; archive evidence, preserve open exposure.
        run: timeout 420 uv run python -m screener tick --rebaseline-inactive --state-dir .screener/live --out .screener/public

      - name: Collect research
        id: research
        if: always()
        continue-on-error: true
        # Allow the bounded 600s research collector to finish and publish.
        timeout-minutes: 11
        run: timeout 660 uv run python -m screener research --state-dir .screener/live --out .screener/public

      - name: Collect entry evidence
        id: entry
        if: always()
        continue-on-error: true
        timeout-minutes: 8
        run: timeout 420 uv run python -m entrydesk collect --max-seconds 400

      - uses: actions/cache/save@v4
        if: always()
        with:
          path: .screener
          key: private-screener-${{ github.ref_name }}-${{ github.run_id }}

      - name: Build public desk
        id: build
        if: always()
        run: |
          for file in latest.json research.json; do
            if [ -f ".screener/public/$file" ]; then cp ".screener/public/$file" "docs/$file"; fi
          done
          uv run python dashboard/build.py

      - name: Commit if changed
        # Never publish new JSON beside an old page after a failed build.
        if: ${{ always() && steps.build.outcome == 'success' }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data.json docs/index.html docs/technical.html
          for file in latest.json research.json entries.json; do
            if [ -f "docs/$file" ]; then git add "docs/$file"; fi
          done
          git diff --staged --quiet && echo "no change" && exit 0
          git commit -m "chore(dashboard): snapshot $(date -u +'%Y-%m-%dT%H:%MZ')"
          # Another hourly run may have landed while this one was collecting.
          git pull --rebase --autostash origin ${{ github.ref_name }}
          git push

      - name: Report collection health
        if: always()
        env:
          SNAPSHOT_OUTCOME: ${{ steps.snapshot.outcome }}
          BREAKOUT_OUTCOME: ${{ steps.breakout.outcome }}
          RESEARCH_OUTCOME: ${{ steps.research.outcome }}
          ENTRY_OUTCOME: ${{ steps.entry.outcome }}
        run: |
          {
            echo '## Collection health'
            echo '| Collector | Outcome |'
            echo '| --- | --- |'
            echo "| Technical snapshot | $SNAPSHOT_OUTCOME |"
            echo "| Breakout evidence | $BREAKOUT_OUTCOME |"
            echo "| Research | $RESEARCH_OUTCOME |"
            echo "| Entry evidence | $ENTRY_OUTCOME |"
            echo ''
            echo 'Usable cached output is retained on collection errors. Check Data coverage and provider timestamps before relying on a snapshot.'
            echo 'The hourly GitHub schedule is best effort; delayed or dropped triggers can leave longer gaps.'
          } >> "$GITHUB_STEP_SUMMARY"
          for outcome in "$SNAPSHOT_OUTCOME" "$BREAKOUT_OUTCOME" "$RESEARCH_OUTCOME" "$ENTRY_OUTCOME"; do
            if [ "$outcome" != success ]; then
              echo '::error::One or more collectors failed or did not run; published data may be partial or stale.'
              exit 1
            fi
          done
